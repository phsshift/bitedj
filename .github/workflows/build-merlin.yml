name: Merlin ARM64 build
on:
  push:
    branches: [ubuntu-touch-merlin]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: merlin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      QT_QPA_PLATFORM: offscreen
      CTEST_OUTPUT_ON_FAILURE: '1'
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Record provenance
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/commit.txt
          uname -a > reports/runner.txt
          dpkg-query -W > reports/packages-before.txt
          echo "merlin-v0.1.0-test.${GITHUB_RUN_NUMBER}" > reports/version.txt
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          tools/debian_buildenv.sh setup < /dev/null 2>&1 | tee reports/dependencies.log
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: merlin-arm64-ccache-v1-${{ github.sha }}
          restore-keys: merlin-arm64-ccache-v1-
      - name: Limit compiler cache
        run: ccache --max-size=2G
      - name: Configure real engine and tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DQT6=ON -DDOWNLOAD_MANUAL=OFF -DINSTALL_USER_UDEV_RULES=OFF -DWARNINGS_FATAL=OFF 2>&1 | tee reports/configure.log
      - name: Compile application and tests
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --target mixxx mixxx-test bitedj-visual-test --parallel 2 2>&1 | tee reports/build.log
      - name: Run upstream unit tests
        id: unit_tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -LE visual --no-tests=error --timeout 120 --parallel 1 --output-junit "${GITHUB_WORKSPACE}/reports/unit-tests.xml" 2>&1 | tee reports/unit-tests.log
      - name: Prepare isolated visual test environment
        id: visual_setup
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/setup-ci-visual.sh 2>&1 | tee reports/visual-setup.log
      - name: Run upstream visual tests
        id: visual_tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -L visual --no-tests=error --timeout 120 --parallel 1 --output-junit "${GITHUB_WORKSPACE}/reports/visual-tests.xml" 2>&1 | tee reports/visual-tests.log
      - name: Stage native installation and audit
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          UNIT_TEST_STATUS: ${{ steps.unit_tests.outcome }}
          VISUAL_SETUP_STATUS: ${{ steps.visual_setup.outcome }}
          VISUAL_TEST_STATUS: ${{ steps.visual_tests.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'unit_tests=%s\nvisual_setup=%s\nvisual_tests=%s\ntarget_runtime=NOT TESTED\n' "$UNIT_TEST_STATUS" "$VISUAL_SETUP_STATUS" "$VISUAL_TEST_STATUS" > reports/validation-status.txt
          DESTDIR="${GITHUB_WORKSPACE}/stage" cmake --install build --prefix /usr 2>&1 | tee reports/install.log
          python3 scripts/audit-native.py stage | tee reports/native-audit.json
          cp README_MERLIN.md BUILD_REPORT.md AUDIO_ROUTING.md TEST_RESULTS.md CHANGELOG_MERLIN.md HANDOFF.md reports/
          tar -czf bitedj-native-arm64.tar.gz -C stage .
          sha256sum bitedj-native-arm64.tar.gz > reports/SHA256SUMS
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: merlin-arm64-ccache-v1-${{ github.sha }}
      - name: Save native diagnostic binary
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: merlin-native-${{ github.run_number }}-${{ github.sha }}
          path: |
            bitedj-native-arm64.tar.gz
            reports/SHA256SUMS
            reports/validation-status.txt
          if-no-files-found: warn
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-v0.1.0-test.${{ github.run_number }}-${{ github.sha }}
          path: |
            reports/
            build/visual-test-output/
            build/Testing/Temporary/
          if-no-files-found: error
# Native build checkpoint only. No Click/install/release claim:
# SDK, Qt platform integration, sandbox and runtime closure still need validation.

  ubuntu-touch-click:
    name: Ubuntu Touch Qt5 SDK / system audio
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check package validators and launcher
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Install pinned Clickable CLI
        run: python -m pip install clickable-ut==8.10.0
      - name: Record target build provenance
        run: |
          mkdir -p reports-ut
          echo "${GITHUB_RUN_NUMBER}" > reports-ut/build-number.txt
          git rev-parse HEAD > reports-ut/commit.txt
          clickable --version > reports-ut/clickable-version.txt
          docker version > reports-ut/docker-version.txt
      - name: Restore SDK compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache-ut-sdk
          key: merlin-ut-qt5-sdk-v1-${{ github.sha }}
          restore-keys: merlin-ut-qt5-sdk-v1-
      - name: Build real application, run unit tests and package Click
        env:
          CLICKABLE_NON_INTERACTIVE: '1'
        shell: bash
        run: |
          set -euo pipefail
          clickable build --config packaging/ubuntu-touch/clickable.yaml --arch arm64 2>&1 | tee reports-ut/clickable.log
          python3 scripts/verify-ut-click.py build reports-ut
      - name: Save target package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-ut-v0.1.0-test.${{ github.run_number }}-${{ github.sha }}
          path: |
            build/**/*.click
            reports-ut/
          if-no-files-found: error
# Target package remains a test build until Lomiri launch and system audio are verified.
