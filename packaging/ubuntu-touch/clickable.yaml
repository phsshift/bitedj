clickable_minimum_required: '8.9.0'
framework: ubuntu-touch-24.04-2.x
# Pin the ARM64 SDK; select GLES development packages to match the phone's Qt.
docker_image: clickable/arm64-ut24.04-1.x-arm64@sha256:42ea2cbe40f91befcb275bdd0a9e1bc36718afc6d4ce3897a68875e6da8cd78d
restrict_arch: arm64
builder: custom
make_jobs: 2
build: bash ${ROOT}/scripts/build-ut-click.sh ${ROOT} ${BUILD_DIR} ${INSTALL_DIR}
env_vars:
  CCACHE_DIR: ${ROOT}/.ccache-ut-sdk
dependencies_host:
  - cmake
  - g++
  - ccache
  - pkg-config
  - git
  - binutils
  - protobuf-compiler
  - fonts-inter
  - fonts-noto-cjk
dependencies_target:
  - libavformat-dev
  - libchromaprint-dev
  - libebur128-dev
  - libfaad-dev
  - libfftw3-dev
  - libflac-dev
  - libgmock-dev
  - libgtest-dev
  - libgles-dev
  - libegl-dev
  - libhidapi-dev
  - libid3tag0-dev
  - liblilv-dev
  - libmad0-dev
  - libmodplug-dev
  - libmp3lame-dev
  - libmsgsl-dev
  - libopus-dev
  - libopusfile-dev
  - libportmidi-dev
  - libprotobuf-dev
  - qtbase5-gles-dev
  - libqt5quick5-gles
  - libqt5sql5-sqlite
  - libqt5svg5-dev
  - librubberband-dev
  - libshout-idjc-dev
  - libsndfile1-dev
  - libsoundtouch-dev
  - libsqlite3-dev
  - libssl-dev
  - libtag1-dev
  - libudev-dev
  - libupower-glib-dev
  - libusb-1.0-0-dev
  - libwavpack-dev
  - lv2-dev
  - portaudio19-dev
  - libasound2-plugins
  - qtdeclarative5-dev
  - qttools5-dev-tools
  - qtkeychain-qt5-dev
