# Process-local PulseAudio bridge. Never reads or replaces system ALSA config.
pcm.!default {
    type pulse
    hint {
        show on
        description "System sound"
    }
}
ctl.!default { type pulse }
pcm.pulse {
    type pulse
    hint {
        show on
        description "System sound (PulseAudio)"
    }
}
ctl.pulse { type pulse }
